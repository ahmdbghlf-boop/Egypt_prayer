<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>مواقيت الصلاة في مصر</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#030712">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background: #030712;
      color: #f9fafb; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: clamp(1rem, 5vw, 2.5rem) 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفيات سائلة مشعة متدرجة خلف الزجاج (Liquid Ambient Background) */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
      animation: floatOrbs 20s infinite alternate ease-in-out;
    }
    body::before {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #059669, #0d9488);
      top: -50px;
      right: -50px;
    }
    body::after {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #2563eb, #3b82f6);
      bottom: -80px;
      left: -80px;
      animation-delay: -10s;
    }

    @keyframes floatOrbs {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 50px) scale(1.15); }
    }
    
    /* حاوية الزجاج السائل الأساسية (Liquid Glass Shell) */
    .container { 
      width: 100%; 
      max-width: 440px; 
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(35px) saturate(210%);
      -webkit-backdrop-filter: blur(35px) saturate(210%);
      border-radius: 2rem; 
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5); 
      padding: 1.75rem; 
      position: relative;
    }

    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { 
      color: #ffffff; 
      font-size: 1.5rem; 
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem; 
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .select-box { margin-bottom: 1.25rem; }
    label { 
      display: block; 
      font-weight: 500; 
      font-size: 0.85rem;
      margin-bottom: 0.5rem; 
      color: rgba(255, 255, 255, 0.7); 
    }
    
    select { 
      width: 100%; 
      padding: 0.85rem 1rem; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 1.25rem; 
      font-size: 0.95rem; 
      background: rgba(255, 255, 255, 0.06); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      outline: none; 
      color: #ffffff;
      font-weight: 500;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(255,255,255,0.6)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: left 1rem center;
      background-size: 1em;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    select:focus {
      border-color: rgba(52, 211, 153, 0.6);
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15);
    }
    option { background: #111827; color: #fff; }
    
    /* كارت الصلاة القادمة الطافي (Floating Glass Card) */
    .next-prayer { 
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(59, 130, 246, 0.35)); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      color: white; 
      border-radius: 1.5rem; 
      padding: 1.5rem; 
      text-align: center; 
      margin-bottom: 1.25rem; 
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transform: translateY(0);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .next-prayer p { font-size: 0.85rem; color: rgba(255, 255, 255, 0.8); font-weight: 500; }
    .next-prayer h2 { 
      font-size: 2.1rem; 
      font-weight: 800; 
      letter-spacing: -0.03em;
      margin: 0.2rem 0; 
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }
    
    .remaining-time { 
      font-size: 1rem; 
      font-weight: 600; 
      background: rgba(255, 255, 255, 0.15); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.5rem 1.25rem; 
      border-radius: 99px; 
      display: inline-block; 
      margin-top: 0.6rem; 
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .prayers-list { display: flex; flex-direction: column; gap: 0.65rem; }
    
    /* كروت الصلوات الزجاجية الأفقية */
    .prayer-card { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0.9rem 1.2rem; 
      border-radius: 1.25rem; 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .prayer-card:active { 
      transform: scale(0.98); 
      background: rgba(255, 255, 255, 0.1);
    }
    .prayer-name { font-weight: 600; color: rgba(255, 255, 255, 0.9); font-size: 0.95rem; }
    .prayer-time { 
      font-weight: 700; 
      color: #38bdf8; 
      direction: ltr; 
      font-size: 1.05rem;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    
    /* زر التفعيل بالزجاج السائل الشفاف (Tactile Liquid Button) */
    .btn-notify { 
      width: 100%; 
      margin-top: 1.25rem; 
      padding: 1rem; 
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(14, 165, 233, 0.8)); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white; 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      border-radius: 1.25rem; 
      font-size: 0.95rem; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 
        0 10px 25px rgba(16, 185, 129, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-notify:active { 
      transform: scale(0.97); 
      box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
    }

    .hint-box { 
      margin-top: 1rem; 
      padding: 0.85rem; 
      background: rgba(255, 255, 255, 0.04); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 1rem; 
      color: rgba(255, 255, 255, 0.65); 
      font-size: 0.78rem; 
      text-align: center; 
      line-height: 1.5; 
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🕌 مواقيت الصلاة - مصر</h1>
      <p id="current-date" style="color: rgba(255,255,255,0.5); font-size: 0.825rem; margin-top: 0.2rem;"></p>
    </header>

    <div class="select-box">
      <label for="citySelect">اختر المحافظة:</label>
      <select id="citySelect"></select>
    </div>

    <div class="next-prayer">
      <p>الصلاة القادمة</p>
      <h2 id="next-prayer-name">--</h2>
      <p id="next-prayer-time">--:--</p>
      <div class="remaining-time" id="remaining-timer">متبقي --:--:--</div>
    </div>

    <div class="prayers-list">
      <div class="prayer-card"><span class="prayer-name">الفجر</span><span class="prayer-time" id="fajr">--:--</span></div>
      <div class="prayer-card"><span class="prayer-name">الشروق</span><span class="prayer-time" id="sunrise">--:--</span></div>
      <div class="prayer-card"><span class="prayer-name">الظهر</span><span class="prayer-time" id="dhuhr">--:--</span></div>
      <div class="prayer-card"><span class="prayer-name">العصر</span><span class="prayer-time" id="asr">--:--</span></div>
      <div class="prayer-card"><span class="prayer-name">المغرب</span><span class="prayer-time" id="maghrib">--:--</span></div>
      <div class="prayer-card"><span class="prayer-name">العشاء</span><span class="prayer-time" id="isha">--:--</span></div>
    </div>

    <button class="btn-notify" onclick="enableNotifications()">تفعيل إشعارات الأذان</button>

    <div class="hint-box">
      💡 <b>تنبيه مهم:</b> على أجهزة iOS وأندرويد، يرجى إضافة التطبيق للشاشة الرئيسية وإبقاؤه يعمل في الخلفية لتضمّن وصول الإشعارات.
    </div>
  </div>

  <script>
    const cities = {
      Cairo: { name: "القاهرة", lat: 30.0444, lng: 31.2357 },
      Alexandria: { name: "الإسكندرية", lat: 31.2001, lng: 29.9187 },
      Giza: { name: "الجيزة", lat: 30.0131, lng: 31.2089 },
      Dakahlia: { name: "المنصورة (الدقهلية)", lat: 31.0409, lng: 31.3785 },
      Gharbia: { name: "طنطا (الغربية)", lat: 30.7865, lng: 31.0004 },
      Sharqia: { name: "الزقازيق (الشرقية)", lat: 30.5877, lng: 31.5020 },
      Monufia: { name: "شبين الكوم (المنوفية)", lat: 30.5503, lng: 31.0106 },
      Qalyubia: { name: "بنها (القليوبية)", lat: 30.4628, lng: 31.1829 },
      Beheira: { name: "دمنهور (البحيرة)", lat: 31.0379, lng: 30.4688 },
      KafrElSheikh: { name: "كفر الشيخ", lat: 31.1107, lng: 30.9388 },
      Faiyum: { name: "الفيوم", lat: 29.3084, lng: 30.8428 },
      BeniSuef: { name: "بني سويف", lat: 29.0661, lng: 31.0994 },
      Minya: { name: "المنيا", lat: 28.1099, lng: 30.7503 },
      Asyut: { name: "أسيوط", lat: 27.1809, lng: 31.1837 },
      Sohag: { name: "سوهاج", lat: 26.5569, lng: 31.6948 },
      Qena: { name: "قنا", lat: 26.1551, lng: 32.7160 },
      Luxor: { name: "الأقصر", lat: 25.6872, lng: 32.6396 },
      Aswan: { name: "أسوان", lat: 24.0889, lng: 32.8998 },
      RedSea: { name: "الغردقة (البحر الأحمر)", lat: 27.2579, lng: 33.8116 },
      NewValley: { name: "الخارجة (الوادي الجديد)", lat: 25.4514, lng: 30.5464 },
      Matrouh: { name: "مرسى مطروح", lat: 31.3543, lng: 27.2373 },
      PortSaid: { name: "بورسعيد", lat: 31.2653, lng: 32.3019 },
      Ismailia: { name: "الإسماعيلية", lat: 30.5965, lng: 32.2715 },
      Suez: { name: "السويس", lat: 29.9668, lng: 32.5498 },
      NorthSinai: { name: "العريش (شمال سيناء)", lat: 31.1316, lng: 33.8032 },
      SouthSinai: { name: "شرم الشيخ (جنوب سيناء)", lat: 27.9158, lng: 34.3299 }
    };

    function calculateEgyptianPrayerTimes(lat, lng, date) {
      const d = new Date(date);
      const dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
      const B = (2 * Math.PI * (dayOfYear - 81)) / 364;
      const EoT = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
      const decl = 23.45 * Math.sin((2 * Math.PI * (284 + dayOfYear)) / 365);
      const timezone = 2;
      
      function getTimeForAngle(angle, isMorning) {
        const radLat = lat * Math.PI / 180;
        const radDecl = decl * Math.PI / 180;
        const radAngle = angle * Math.PI / 180;
        let cosH = (Math.sin(radAngle) - Math.sin(radLat) * Math.sin(radDecl)) / (Math.cos(radLat) * Math.cos(radDecl));
        if (cosH > 1) cosH = 1; if (cosH < -1) cosH = -1;
        let H = Math.acos(cosH) * 180 / Math.PI / 15;
        if (isMorning) H = 24 - H;
        const T = H + 12 - (EoT / 60) - (lng / 15) + timezone;
        return (T + 24) % 24;
      }

      function getAsrTime() {
        const radLat = lat * Math.PI / 180;
        const radDecl = decl * Math.PI / 180;
        const shadowLength = 1 + Math.tan(Math.abs(radLat - radDecl));
        const angle = Math.atan(1 / shadowLength) * 180 / Math.PI;
        return getTimeForAngle(angle, false);
      }

      return {
        fajr: getTimeForAngle(-19.5, true),
        sunrise: getTimeForAngle(-0.833, true),
        dhuhr: 12 - (EoT / 60) - (lng / 15) + timezone,
        asr: getAsrTime(),
        maghrib: getTimeForAngle(-0.833, false),
        isha: getTimeForAngle(-17.5, false)
      };
    }

    function formatTime(hours) {
      let h = Math.floor(hours);
      let m = Math.floor((hours - h) * 60);
      const ampm = h >= 12 ? 'م' : 'ص';
      h = h % 12 || 12;
      return `${h}:${m < 10 ? '0' : ''}${m} ${ampm}`;
    }

    const selectElem = document.getElementById('citySelect');
    Object.keys(cities).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = cities[key].name;
      selectElem.appendChild(opt);
    });

    const savedCity = localStorage.getItem('userCity') || 'Cairo';
    selectElem.value = savedCity;

    let countdownInterval;

    function updateUI() {
      const cityKey = selectElem.value;
      localStorage.setItem('userCity', cityKey);
      const city = cities[cityKey];
      
      const now = new Date();
      document.getElementById('current-date').textContent = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      const times = calculateEgyptianPrayerTimes(city.lat, city.lng, now);

      document.getElementById('fajr').textContent = formatTime(times.fajr);
      document.getElementById('sunrise').textContent = formatTime(times.sunrise);
      document.getElementById('dhuhr').textContent = formatTime(times.dhuhr);
      document.getElementById('asr').textContent = formatTime(times.asr);
      document.getElementById('maghrib').textContent = formatTime(times.maghrib);
      document.getElementById('isha').textContent = formatTime(times.isha);

      const currentDecimalHour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
      const prayerList = [
        { name: 'الفجر', time: times.fajr },
        { name: 'الشروق', time: times.sunrise },
        { name: 'الظهر', time: times.dhuhr },
        { name: 'العصر', time: times.asr },
        { name: 'المغرب', time: times.maghrib },
        { name: 'العشاء', time: times.isha }
      ];

      let next = prayerList.find(p => p.time > currentDecimalHour);
      let isNextDay = false;

      if (!next) {
        next = prayerList[0];
        isNextDay = true;
      }

      document.getElementById('next-prayer-name').textContent = next.name;
      document.getElementById('next-prayer-time').textContent = formatTime(next.time);

      clearInterval(countdownInterval);
      
      function startCountdown() {
        const currentTime = new Date();
        let targetHours = next.time;
        if (isNextDay) targetHours += 24;

        let diffHours = targetHours - (currentTime.getHours() + currentTime.getMinutes() / 60 + currentTime.getSeconds() / 3600);
        if (diffHours < 0) diffHours += 24;

        const totalSeconds = Math.floor(diffHours * 3600);
        
        if (totalSeconds === 0 && Notification.permission === 'granted') {
          showPrayerNotification(next.name);
        }

        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;

        const pad = (n) => n < 10 ? '0' + n : n;
        document.getElementById('remaining-timer').textContent = `متبقي ${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }

      startCountdown();
      countdownInterval = setInterval(startCountdown, 1000);
    }

    selectElem.addEventListener('change', updateUI);
    updateUI();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    function showPrayerNotification(prayerName) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(`حان الآن موعد أذان ${prayerName}`, {
            body: `حي على الصلاة، حي على الفلاح (${selectElem.options[selectElem.selectedIndex].text})`,
            icon: 'https://cdn-icons-png.flaticon.com/512/2928/2928134.png',
            vibrate: [500, 200, 500]
          });
        });
      }
    }

    function enableNotifications() {
      if (!('Notification' in window)) {
        alert('هذا المتصفح لا يدعم الإشعارات.');
        return;
      }

      Notification.requestPermission().then(perm => {
        if (perm === 'granted') {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(reg => {
              reg.showNotification('مواقيت الصلاة', {
                body: 'تم تفعيل إشعارات الأذان بنجاح على جهازك!',
                icon: 'https://cdn-icons-png.flaticon.com/512/2928/2928134.png',
                vibrate: [200, 100, 200]
              });
            });
          }
        } else {
          alert('تم رفض إذن الإشعارات، يرجى تفعيله من إعدادات النظام.');
        }
      });
    }
  </script>
</body>
</html>
